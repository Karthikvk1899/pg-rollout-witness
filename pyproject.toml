[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-rollout-witness"
version = "0.1.0"
description = "Execute PostgreSQL migrations with old and new application probes on disposable fixtures"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.9", "jsonschema==4.26.0"]

[project.optional-dependencies]
embedded = ["pgserver==0.1.4"]

[project.scripts]
pg-rollout-witness = "witness.cli:main"

[tool.setuptools]
packages = ["witness"]

[tool.setuptools.package-data]
witness = ["*.json"]
